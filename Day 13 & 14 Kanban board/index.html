<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right"><button id="kanbab-btn" class="toggle-modal">Add New Task</button></div>
        </nav>
        <section class="board">  
            <div class="task-colum " id="todo">
                <div class="heading">
                    <div class="left">To-do</div>
                    <div class="right">Count</div>
                </div>
                <!-- <div class="task" draggable="true">
                    <h2>Task 1</h2>
                    <p>Description for Task 1</p>
                    <div class="btns">
                        <button>Edit</button>
                        <button id="delt-btn">Delete</button>
                    </div>
                </div> -->
            </div>
            <div class="task-colum" id="progress">
                <div class="heading">
                    <div class="left">In-progress</div>
                    <div class="right">Count</div>
                </div>
                 <!-- <div class="task" draggable="true">
                    <h2>Task 2</h2>
                    <p>Description for Task 2</p>
                     <div class="btns">
                        <button>Edit</button>
                        <button id="delt-btn">Delete</button>
                    </div>
                </div> -->
            </div>
            <div class="task-colum" id="done">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
                 <!-- <div class="task" draggable="true">
                    <h2>Task 3</h2>
                    <p>Description for Task 3</p>
                     <div class="btns">
                        <button>Edit</button>
                        <button id="delt-btn">Delete</button>
                    </div>
                </div> -->
            </div>
        </section>
    </main>
    <div class="modal add-new-task active">
        <div class="bg"></div>
        <div class="center">
            <input type="text" placeholder="Task Title" id="task-title-input">
            <textarea placeholder="Task Description" id="task-desc-input"></textarea>
            <button class="add-task-btn" id="add-new-task">Add Task</button>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
